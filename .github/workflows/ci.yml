name: CI

on:
  push:
    branches: [main, "preview/verify-deployment"]
  pull_request:
    branches: [main, "preview/verify-deployment"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ci-backend-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify Java 17 runtime
        run: java -version 2>&1 | grep -q 'version "17\.'
      - name: Run backend test suite
        working-directory: backend
        run: ./mvnw -B -ntp test
      - name: Run production configuration guards
        working-directory: backend
        run: ./mvnw -B -ntp -Dtest=DeploymentProfileGuardTest,MysqlConfigurationGuardTest,JwtSecretGuardTest test
      - name: Package and verify migrations are in the JAR
        working-directory: backend
        run: |
          set -o pipefail
          ./mvnw -B -ntp package -DskipTests
          migrations=$(jar tf target/autoscientist-backend-1.0.0-SNAPSHOT.jar \
            | grep -E 'BOOT-INF/classes/db/migration/V[1-7]__.+\.sql' | sort)
          printf '%s\n' "$migrations"
          test "$(printf '%s\n' "$migrations" | wc -l | tr -d ' ')" -eq 7
      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-reports-${{ github.sha }}
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend lint, tests, audit and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ci-frontend-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify Node version
        run: node --version | grep -q '^v22\.'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run frontend tests
        run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Build production bundle
        env:
          VITE_API_BASE_URL: https://ci.invalid/api
        run: npm run build
      - name: Assert no local API references in production bundle
        run: |
          if grep -R -n -E 'https?://(localhost|127\.0\.0\.1):(8080|5173|3000)' dist; then
            echo 'Local API reference found in production bundle.' >&2
            exit 1
          fi
      - name: Upload production bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist/
          if-no-files-found: error

  docker:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    concurrency:
      group: ci-docker-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build root context image used by Render
        run: docker build -f Dockerfile -t autoscientist-backend:ci .
      - name: Build backend context image
        run: docker build -f backend/Dockerfile -t autoscientist-backend-service:ci backend

  mysql-migrations:
    name: MySQL Flyway migrations (V1-V7)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ci-mysql-${{ github.ref }}
      cancel-in-progress: true
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: placeholder_unused
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify Java 17 runtime
        run: java -version 2>&1 | grep -q 'version "17\.'
      - name: Validate Flyway V1-V7 and application startup against disposable MySQL
        working-directory: backend
        env:
          AS_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/?allowPublicKeyRetrieval=true&sslMode=DISABLED&serverTimezone=UTC
          AS_TEST_MYSQL_ENVIRONMENT: staging
          AS_TEST_MYSQL_USER: root
          AS_TEST_MYSQL_PASSWORD: root
          AS_TEST_MYSQL_ALLOW_SCHEMA_CREATE_DROP: "true"
        run: ./mvnw -B -ntp -Dtest=RealMysqlMigrationTest,MysqlProfileRuntimeSmokeTest test
      - name: Upload MySQL migration reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mysql-migration-reports-${{ github.sha }}
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  security:
    name: Secret and dependency vulnerability scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ci-security-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Scan tracked files for obvious secret material
        run: |
          if git grep -nIE '(AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36}|sk-[A-Za-z0-9_-]{32,}|-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----|jdbc:mysql://[^:/[:space:]]+:[^@[:space:]]+@|(JWT_SECRET|SPRING_DATASOURCE_PASSWORD|PASSWORD_RESET_SECRET)=[^$#[:space:]]{16,})' -- ':!*.lock' ':!package-lock.json' ':!*.md' ':!*.example' ':!.github/workflows/ci.yml'; then
            echo 'Potential secret material found in tracked files.' >&2
            exit 1
          fi
      - name: Reject tracked secret, backup, upload, database, and generated files
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.(pem|key|p12|pfx|jks|keystore)$|(^|/)(backups|uploads|target|dist|node_modules)/|\.mv\.db$'; then
            echo 'Forbidden tracked file detected.' >&2
            exit 1
          fi
      - name: Scan lockfiles with OSV
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src \
            ghcr.io/google/osv-scanner:v2.7.1 scan \
            --lockfile=backend/pom.xml \
            --lockfile=frontend/package-lock.json

  deploy-config:
    name: Validate deployment configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ci-config-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.13.0"
      - name: Validate provider and repository configuration
        run: bash scripts/validate-deployment-config.sh

  workflow-lint:
    name: Validate GitHub Actions workflow syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ci-workflow-lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install actionlint 1.7.12
        run: |
          set -euo pipefail
          curl -fsSLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz' | sha256sum -c -
          tar xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint -version
      - name: Lint workflows
        run: actionlint -color

  deploy-preview:
    name: Deploy preview environment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend, docker, mysql-migrations, security, deploy-config, workflow-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/preview/verify-deployment' && vars.PREVIEW_DEPLOY_ENABLED == 'true'
    concurrency:
      group: deploy-preview
      cancel-in-progress: false
    environment: preview
    steps:
      - name: Trigger preview deployments and verify health
        env:
          RENDER_HOOK: ${{ secrets.RENDER_PREVIEW_DEPLOY_HOOK_URL }}
          VERCEL_HOOK: ${{ secrets.VERCEL_PREVIEW_DEPLOY_HOOK_URL }}
          BACKEND_HEALTH_URL: ${{ vars.PREVIEW_BACKEND_HEALTH_URL }}
          FRONTEND_HEALTH_URL: ${{ vars.PREVIEW_FRONTEND_HEALTH_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$RENDER_HOOK"
          test -n "$VERCEL_HOOK"
          test -n "$BACKEND_HEALTH_URL"
          test -n "$FRONTEND_HEALTH_URL"
          case "$BACKEND_HEALTH_URL$FRONTEND_HEALTH_URL" in
            *localhost*|*127.0.0.1*) echo 'Health URLs must use deployed hosts.' >&2; exit 1 ;;
          esac
          curl -fsS -X POST "${RENDER_HOOK}?ref=${EXPECTED_SHA}"
          curl -fsS -X POST "$VERCEL_HOOK"
          for i in $(seq 1 30); do
            body=$(curl -fsS --max-time 10 "$BACKEND_HEALTH_URL" 2>/dev/null || true)
            if printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if str(d.get("data",{}).get("status","")).upper()=="UP" else 1)' 2>/dev/null; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Preview backend readiness check failed: $BACKEND_HEALTH_URL" >&2
              exit 1
            fi
            sleep 10
          done
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$FRONTEND_HEALTH_URL" >/dev/null 2>&1; then
              exit 0
            fi
            if [ "$i" -eq 30 ]; then
              echo "Preview frontend health check failed: $FRONTEND_HEALTH_URL" >&2
              exit 1
            fi
            sleep 10
          done

  deploy-production:
    name: Deploy production environment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend, docker, mysql-migrations, security, deploy-config, workflow-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment: production
    steps:
      - name: Trigger production deployments and verify health
        env:
          RENDER_HOOK: ${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK_URL }}
          VERCEL_HOOK: ${{ secrets.VERCEL_PRODUCTION_DEPLOY_HOOK_URL }}
          BACKEND_HEALTH_URL: ${{ vars.PRODUCTION_BACKEND_HEALTH_URL }}
          FRONTEND_HEALTH_URL: ${{ vars.PRODUCTION_FRONTEND_HEALTH_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$RENDER_HOOK"
          test -n "$VERCEL_HOOK"
          test -n "$BACKEND_HEALTH_URL"
          test -n "$FRONTEND_HEALTH_URL"
          case "$BACKEND_HEALTH_URL$FRONTEND_HEALTH_URL" in
            *localhost*|*127.0.0.1*) echo 'Health URLs must use deployed hosts.' >&2; exit 1 ;;
          esac
          curl -fsS -X POST "${RENDER_HOOK}?ref=${EXPECTED_SHA}"
          curl -fsS -X POST "$VERCEL_HOOK"
          for i in $(seq 1 30); do
            body=$(curl -fsS --max-time 10 "$BACKEND_HEALTH_URL" 2>/dev/null || true)
            if printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if str(d.get("data",{}).get("status","")).upper()=="UP" else 1)' 2>/dev/null; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Production backend readiness check failed: $BACKEND_HEALTH_URL" >&2
              exit 1
            fi
            sleep 10
          done
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$FRONTEND_HEALTH_URL" >/dev/null 2>&1; then
              exit 0
            fi
            if [ "$i" -eq 30 ]; then
              echo "Production frontend health check failed: $FRONTEND_HEALTH_URL" >&2
              exit 1
            fi
            sleep 10
          done
