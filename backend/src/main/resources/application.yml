server:

  # Render supplies $PORT; local dev and Docker default to 8080.
  # SERVER_PORT takes priority; PORT is the Render-conventional fallback.
  port: ${SERVER_PORT:${PORT:8080}}

  # Let in-flight requests finish when the platform sends SIGTERM.
  shutdown: graceful

  # Respect X-Forwarded-Proto/Host from the hosting provider's TLS terminator.
  forward-headers-strategy: framework

  servlet:

    context-path: /



spring:

  application:

    name: autoscientist-backend

  profiles:

    active: ${SPRING_PROFILES_ACTIVE:mysql}

  lifecycle:

    # Give in-flight requests and pools time to close before the JVM exits.
    timeout-per-shutdown-phase: 30s



  servlet:

    multipart:

      max-file-size: 50MB

      max-request-size: 50MB



  jpa:

    open-in-view: false

    show-sql: ${SPRING_JPA_SHOW_SQL:false}

    properties:

      hibernate:

        format_sql: true



  # Flyway is disabled by default: dev/test use H2 create-drop owned by Hibernate.

  # The mysql profile below enables versioned migrations (classpath:db/migration).

  flyway:

    enabled: false



app:

  jwt:

    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours

  cors:

    # Comma-separated browser origins. The mysql profile below has no default,
    # so production startup fails unless APP_CORS_ALLOWED_ORIGINS is supplied.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

  upload:

    dir: ${FILE_UPLOAD_DIR:./uploads/datasets}

  password-reset:

    token-ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:30}

    min-interval-seconds: ${PASSWORD_RESET_MIN_INTERVAL_SECONDS:60}

    frontend-url: ${FRONTEND_URL:http://localhost:5173}

    from: ${PASSWORD_RESET_FROM:no-reply@autoscientist.local}

    outbox-enabled: ${PASSWORD_RESET_OUTBOX_ENABLED:false}

    outbox-dir: ${PASSWORD_RESET_OUTBOX_DIR:./data/mail-outbox}



---

spring:

  config:

    activate:

      on-profile: mysql

  datasource:

    # No credential defaults on purpose: staging/production must supply
    # SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD (e.g. via backend/.env —
    # see scripts/run_backend.sh, which exports .env before starting).
    # Startup fails fast if any of the three is missing.

    url: ${SPRING_DATASOURCE_URL}

    username: ${SPRING_DATASOURCE_USERNAME}

    password: ${SPRING_DATASOURCE_PASSWORD}

    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:

      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}

      minimum-idle: ${DB_POOL_MIN_IDLE:2}

      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}

      validation-timeout: 5000

      idle-timeout: 600000

      max-lifetime: 1800000

  # No default here on purpose: staging/production must supply JWT_SECRET
  # (base64, >= 64 bytes decoded, e.g. `openssl rand -base64 64 | tr -d '\n'`).
  # Startup fails fast if it is missing; the dev-only fallback lives in the
  # default profile above and must never be used outside local development.

  jpa:

    hibernate:

      # Flyway owns production schema changes; validate instead of silently
      # altering the live schema. Override only in isolated dev/test.
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

    database-platform: org.hibernate.dialect.MySQLDialect

  flyway:

    enabled: ${SPRING_FLYWAY_ENABLED:true}

    # Databases that predate Flyway are baselined at V1; the additive V2-V4
    # deltas are applied to them. Fresh databases run V1-V4.

    baseline-on-migrate: true

    baseline-version: 1

    locations: classpath:db/migration

    validate-on-migrate: true

    connect-retries: 10



app:

  jwt:

    # Required, no fallback: startup fails fast when JWT_SECRET is unset.

    secret: ${JWT_SECRET}

  cors:

    # Required, no fallback: a production deployment must name its browser origin.

    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}

  upload:

    # Required, no fallback: point this at the mounted persistent disk.

    dir: ${FILE_UPLOAD_DIR}

  password-reset:

    # Required, no fallback: reset links must point at the public frontend.

    frontend-url: ${FRONTEND_URL}

    # Set the spring.mail.* variables to enable actual email delivery.

    from: ${PASSWORD_RESET_FROM:no-reply@autoscientist.local}



---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # Persistent file-backed H2 for local development: preserves accounts, datasets, and models across restarts.
    # Stored deterministically at backend/data/h2/autoscientist_dev.mv.db.
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/h2/autoscientist_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      # Use update to retain existing tables and data across restarts, creating missing structures non-destructively.
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  password-reset:
    outbox-enabled: true
