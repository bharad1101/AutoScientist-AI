server:

  # Render supplies $PORT; local dev and Docker default to 8080.
  # SERVER_PORT takes priority; PORT is the Render-conventional fallback.
  port: ${SERVER_PORT:${PORT:8080}}

  servlet:

    context-path: /



spring:

  application:

    name: autoscientist-backend

  profiles:

    active: ${SPRING_PROFILES_ACTIVE:mysql}



  servlet:

    multipart:

      max-file-size: 50MB

      max-request-size: 50MB



  jpa:

    open-in-view: false

    show-sql: ${SPRING_JPA_SHOW_SQL:false}

    properties:

      hibernate:

        format_sql: true



  # Flyway is disabled by default: dev/test use H2 create-drop owned by Hibernate.

  # The mysql profile below enables versioned migrations (classpath:db/migration).

  flyway:

    enabled: false



app:

  jwt:

    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours

  upload:

    dir: ${FILE_UPLOAD_DIR:./uploads/datasets}



---

spring:

  config:

    activate:

      on-profile: mysql

  datasource:

    # No credential defaults on purpose: staging/production must supply
    # SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD (e.g. via backend/.env —
    # see scripts/run_backend.sh, which exports .env before starting).
    # Startup fails fast if any of the three is missing.

    url: ${SPRING_DATASOURCE_URL}

    username: ${SPRING_DATASOURCE_USERNAME}

    password: ${SPRING_DATASOURCE_PASSWORD}

    driver-class-name: com.mysql.cj.jdbc.Driver

  # No default here on purpose: staging/production must supply JWT_SECRET
  # (base64, >= 64 bytes decoded, e.g. `openssl rand -base64 64 | tr -d '\n'`).
  # Startup fails fast if it is missing; the dev-only fallback lives in the
  # default profile above and must never be used outside local development.

  jpa:

    hibernate:

      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

    database-platform: org.hibernate.dialect.MySQLDialect

  flyway:

    enabled: ${SPRING_FLYWAY_ENABLED:true}

    # Databases that predate Flyway are baselined at V1; only the additive
    # V2 delta is applied to them. Fresh databases run V1 + V2.

    baseline-on-migrate: true

    baseline-version: 1

    locations: classpath:db/migration

    validate-on-migrate: true

    connect-retries: 10



app:

  jwt:

    # Required, no fallback: startup fails fast when JWT_SECRET is unset.

    secret: ${JWT_SECRET}



---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # Persistent file-backed H2 for local development: preserves accounts, datasets, and models across restarts.
    # Stored deterministically at backend/data/h2/autoscientist_dev.mv.db.
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/h2/autoscientist_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      # Use update to retain existing tables and data across restarts, creating missing structures non-destructively.
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
