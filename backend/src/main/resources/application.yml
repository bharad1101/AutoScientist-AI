server:

  # Render supplies $PORT; local dev and Docker default to 8080.
  # SERVER_PORT takes priority; PORT is the Render-conventional fallback.
  port: ${SERVER_PORT:${PORT:8080}}

  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

  # Let in-flight requests finish when the platform sends SIGTERM.
  shutdown: graceful

  # Do not trust client-supplied X-Forwarded-* headers by default. A deployment
  # behind a known TLS terminator that strips/sets these headers may opt in with
  # FORWARD_HEADERS_STRATEGY=framework; leaving this at none prevents arbitrary
  # forwarded headers from influencing request identity, scheme or host.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

  servlet:

    context-path: /



spring:

  application:

    name: autoscientist-backend

  profiles:

    # Local development is the default so `./mvnw spring-boot:run` works, but it
    # must be explicitly acknowledged with APP_ENVIRONMENT=local. Deployments set
    # SPRING_PROFILES_ACTIVE=mysql; guards reject dev on any unacknowledged host.
    active: ${SPRING_PROFILES_ACTIVE:dev}

  lifecycle:

    # Give in-flight requests and pools time to close before the JVM exits.
    timeout-per-shutdown-phase: 30s



  http:

    converters:

      preferred-json-mapper: jackson2



  servlet:

    multipart:

      max-file-size: ${UPLOAD_MAX_FILE_SIZE:50MB}

      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:50MB}



  # SMTP is configured through SPRING_MAIL_* environment variables. These
  # timeouts stop a slow or unreachable mail provider from holding a request
  # (and a database transaction) open indefinitely. They are harmless when no
  # mail host is configured.
  mail:

    default-encoding: UTF-8

    properties:

      mail:

        smtp:

          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:10000}

          timeout: ${MAIL_TIMEOUT_MS:10000}

          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:10000}



  jpa:

    open-in-view: false

    show-sql: ${SPRING_JPA_SHOW_SQL:false}

    properties:

      hibernate:

        format_sql: true



  # Flyway is disabled by default: dev/test use H2 create-drop owned by Hibernate.

  # The mysql profile below enables versioned migrations (classpath:db/migration).

  flyway:

    enabled: false



# Bounded ingestion and analysis budgets. Upload file size is enforced by both
# spring.servlet.multipart and resource-budget.max-mb (keep them aligned).
resource-budget:
  max-mb: ${RESOURCE_BUDGET_MAX_MB:50}
  max-rows: ${RESOURCE_BUDGET_MAX_ROWS:1000000}
  max-columns: ${RESOURCE_BUDGET_MAX_COLUMNS:5000}
  max-cells: ${RESOURCE_BUDGET_MAX_CELLS:10000000}
  max-sheets: ${RESOURCE_BUDGET_MAX_SHEETS:20}


app:

  jwt:

    secret: ${JWT_SECRET}

    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours

  rate-limit:

    # Per-principal (or per-IP when anonymous) token bucket. This is a
    # single-node limiter; use a shared store/gateway limiter for horizontally
    # scaled deployments.
    enabled: ${RATE_LIMIT_ENABLED:true}

    capacity: ${RATE_LIMIT_CAPACITY:120}

    refill-tokens: ${RATE_LIMIT_REFILL_TOKENS:120}

    refill-minutes: ${RATE_LIMIT_REFILL_MINUTES:1}

    max-buckets: ${RATE_LIMIT_MAX_BUCKETS:10000}

    # Number of reverse-proxy hops whose X-Forwarded-For entries are trusted for
    # anonymous client identity. Zero (default) ignores the header entirely and
    # keys by the servlet container's remote address; only raise this when the
    # proxy topology is known and the edge strips untrusted forwarded headers.
    trusted-proxy-count: ${TRUSTED_PROXY_COUNT:0}

  cors:

    # Comma-separated browser origins. The mysql profile below has no default,
    # so production startup fails unless APP_CORS_ALLOWED_ORIGINS is supplied.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

  upload:

    dir: ${FILE_UPLOAD_DIR:./uploads/datasets}

  jobs:

    cleanup-cron: ${JOB_CLEANUP_CRON:0 0 * * * *}

  password-reset:

    token-ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:30}

    min-interval-seconds: ${PASSWORD_RESET_MIN_INTERVAL_SECONDS:60}

    frontend-url: ${FRONTEND_URL:http://localhost:5173}

    from: ${PASSWORD_RESET_FROM:no-reply@autoscientist.local}

    outbox-enabled: ${PASSWORD_RESET_OUTBOX_ENABLED:false}

    outbox-dir: ${PASSWORD_RESET_OUTBOX_DIR:./data/mail-outbox}

# Every log line carries the request/correlation id set by RequestIdFilter.
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-no-request}] %logger{40} - %msg%n"



---

spring:

  config:

    activate:

      on-profile: mysql

  datasource:

    # No credential defaults on purpose: staging/production must supply
    # SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD (e.g. via backend/.env —
    # see scripts/run_backend.sh, which exports .env before starting).
    # Startup fails fast if any of the three is missing.

    url: ${SPRING_DATASOURCE_URL}

    username: ${SPRING_DATASOURCE_USERNAME}

    password: ${SPRING_DATASOURCE_PASSWORD}

    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:

      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}

      minimum-idle: ${DB_POOL_MIN_IDLE:2}

      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}

      validation-timeout: 5000

      idle-timeout: 600000

      max-lifetime: 1800000

  # No default here on purpose: staging/production must supply JWT_SECRET
  # (Base64-encoded HS256 key, at least 32 decoded bytes; 64 random bytes
  # recommended, e.g. `openssl rand -base64 64 | tr -d '\n'`).

  jpa:

    hibernate:

      # Flyway owns production schema changes; validate instead of silently
      # altering the live schema. Override only in isolated dev/test.
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

    database-platform: org.hibernate.dialect.MySQLDialect

  flyway:

    enabled: ${SPRING_FLYWAY_ENABLED:true}

    # Databases that predate Flyway are baselined at V1; the additive V2-V7
    # deltas are applied to them. Fresh databases run V1-V7.

    baseline-on-migrate: true

    baseline-version: 1

    locations: classpath:db/migration

    validate-on-migrate: true

    connect-retries: 10



app:

  jwt:

    # Required, no fallback: startup fails fast when JWT_SECRET is unset.

    secret: ${JWT_SECRET}

  cors:

    # Required, no fallback: a production deployment must name its browser origin.

    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}

  upload:

    # Local filesystem path for uploaded datasets. The Dockerfile sets
    # FILE_UPLOAD_DIR=/app/uploads/datasets; override only if needed.

    dir: ${FILE_UPLOAD_DIR:/app/uploads/datasets}

  password-reset:

    # Required, no fallback: reset links must point at the public frontend.

    frontend-url: ${FRONTEND_URL}

    # Set the spring.mail.* variables to enable actual email delivery.

    from: ${PASSWORD_RESET_FROM:no-reply@autoscientist.local}



---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # Persistent file-backed H2 for local development: preserves accounts, datasets, and models across restarts.
    # Stored deterministically at backend/data/h2/autoscientist_dev.mv.db.
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/h2/autoscientist_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      # Use update to retain existing tables and data across restarts, creating missing structures non-destructively.
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  password-reset:
    outbox-enabled: true

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: false
  metrics:
    tags:
      application: autoscientist-backend
